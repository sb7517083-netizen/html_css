<h1>Matrícula - Escola Online</h1>

<form>

<fieldset>
<legend>Dados Pessoais</legend>

<label for="nome">Nome Completo:</label>
<input type="text" id="nome" name="nome">
<br><br>
<label for="nascimento">Data de Nascimento:</label>
<input type="date" id="nascimento" name="nascimento">
<br><br>
<label for="email">E-mail do Aluno:</label>
<input type="email" id="email" name="email"
placeholder="aluno@exemplo.com">
<br><br>
<label for="senha">Senha de Acesso:</label>
<input type="password" id="senha" name="senha"
placeholder="******">
<br><br>
<label for="telefone">Telefone de Emergência:</label>
<input type="tel" id="telefone" name="telefone"
placeholder="(00) 00000-0000">
</fieldset>


<fieldset>
<legend>Preferências de Estudo</legend>

<p>Áreas de Interesse:</p>
<input type="checkbox" id="frontend" name="interesse" value="Front-end">
<label for="frontend">Front-end</label>
<br>
<input type="checkbox" id="backend" name="interesse" value="Back-end">
<label for="backend">Back-end</label>
<br>
<input type="checkbox" id="design" name="interesse" value="Design">
<label for="design">Design</label>
<br>
<input type="checkbox" id="dados" name="interesse" value="Dados">
<label for="dados">Dados</label>
<br><br>

<label for="como">Como conheceu a escola?</label>

<select id="como" name="como">
<option value="indicacao">Indicação</option>
<option value="internet">Internet</option>
<option value="redes-sociais">Redes Sociais</option>
<option value="amigos">Amigos</option>
</select>

</fieldset>
<br>
<button type="submit">Matricular</button>
<button type="reset">Limpar</button>

</form>

</body>
</html>
